name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck backend
        run: npx tsc -p tsconfig.backend.json --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_KITCHEN_URL: ${{ secrets.VITE_SUPABASE_KITCHEN_URL }}
          VITE_SUPABASE_KITCHEN_ANON_KEY: ${{ secrets.VITE_SUPABASE_KITCHEN_ANON_KEY }}
          VITE_BACKEND_URL: http://localhost:8002
